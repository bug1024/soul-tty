[project]
name = "voice-agent"
version = "0.1.0"
description = "本地低延迟语音对话 Agent：sherpa-onnx -> llama.cpp -> Qwen3-TTS"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=14.0",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-bin==1.13.4",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
